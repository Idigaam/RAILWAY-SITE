<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOYA Rail — Sign Up</title>

    <link rel="stylesheet" href="css/signup.css">
</head>


<body class="signup-page">


    <!-- =====================================================
         TOP HEADER
    ====================================================== -->

    <header class="signup-header">

        <a
            href="index.html"
            class="voya-logo"
        >

            <img
                src="Media/voya-logo.png"
                alt="VOYA Rail"
            >

        </a>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to home
        </a>

    </header>



    <!-- =====================================================
         MAIN SIGN UP AREA
    ====================================================== -->

    <main class="signup-layout">


        <!-- =================================================
             LEFT HERO
        ================================================== -->

        <section class="signup-hero">


            <div class="hero-overlay"></div>


            <div class="hero-content">


                <div class="hero-tag">
                    RIDE THE LINE
                </div>


                <h1>
                    Every ticket shows the
                    full fare board — class,
                    route, and price, no
                    guessing.
                </h1>


            </div>

        </section>



        <!-- =================================================
             RIGHT SIGN UP PANEL
        ================================================== -->

        <section class="signup-panel">


            <div class="signup-card">


                <!-- =========================================
                     LOGIN / SIGN UP SWITCH
                ========================================== -->

                <div class="auth-switch">

                    <a
                        href="login.html"
                        class="switch-login"
                    >
                        Log in
                    </a>


                    <span class="switch-signup active">
                        Sign up
                    </span>

                </div>



                <!-- =========================================
                     TITLE
                ========================================== -->

                <h2>
                    Welcome to Voya
                </h2>



                <!-- =========================================
                     SIGN UP FORM
                ========================================== -->

                <form
                    id="signup-form"
                    novalidate
                >


                    <!-- NAME -->

                    <div class="name-row">


                        <div class="field">

                            <label for="firstName">
                                First name
                            </label>

                            <input
                                id="firstName"
                                name="firstName"
                                type="text"
                                placeholder=""
                                autocomplete="given-name"
                                required
                            >

                        </div>


                        <div class="field">

                            <label for="lastName">
                                Last name
                            </label>

                            <input
                                id="lastName"
                                name="lastName"
                                type="text"
                                placeholder=""
                                autocomplete="family-name"
                                required
                            >

                        </div>


                    </div>



                    <!-- EMAIL -->

                    <div class="field">

                        <label for="signupEmail">
                            Email address
                        </label>

                        <input
                            id="signupEmail"
                            name="email"
                            type="email"
                            placeholder=""
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- CREATE PASSWORD -->

                    <div class="field">

                        <label for="createPassword">
                            Create password
                        </label>


                        <div class="password-field">

                            <input
                                id="createPassword"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="createPassword"
                                aria-label="Show password"
                            >
                                <span class="eye-icon">◉</span>
                            </button>

                        </div>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="field">

                        <label for="confirmPassword">
                            Confirm password
                        </label>


                        <div class="password-field">

                            <input
                                id="confirmPassword"
                                name="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >
                                <span class="eye-icon">◉</span>
                            </button>

                        </div>

                    </div>



                    <!-- TERMS -->

                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >


                        <label for="terms">

                            I agree to VOYA's

                            <a href="#">
                                Terms of Service
                            </a>

                            and

                            <a href="#">
                                Privacy Policy
                            </a>

                        </label>

                    </div>



                    <!-- SIGN UP BUTTON -->

                    <button
                        type="submit"
                        class="signup-button"
                        id="signup-button"
                    >
                        Sign up
                    </button>



                </form>



                <!-- =========================================
                     DIVIDER
                ========================================== -->

                <div class="divider">

                    <span>
                        or continue with
                    </span>

                </div>



                <!-- =========================================
                     SOCIAL LOGIN
                ========================================== -->

                <div class="social-login">


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="social-button"
                        id="google-button"
                    >

                        <svg
                            class="google-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.68-.06-1.34-.17-1.97H12v3.73h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.15z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.75c2.63 0 4.84-.87 6.45-2.33l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.52A9.75 9.75 0 0 0 12 21.75z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 13.86A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.86V7.62H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.04 4.38l3.25-2.52z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.11c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.18 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.37l3.25 2.52C7.31 7.83 9.46 6.11 12 6.11z"
                            />

                        </svg>


                        <span>
                            Google
                        </span>

                    </button>



                    <!-- APPLE -->

                    <button
                        type="button"
                        class="social-button"
                        id="apple-button"
                    >

                        <svg
                            class="apple-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M17.05 12.54c-.02-2.01 1.64-2.98 1.71-3.02-.94-1.37-2.4-1.56-2.91-1.58-1.22-.13-2.4.73-3.02.73-.63 0-1.6-.72-2.63-.7-1.35.02-2.6.79-3.3 2.02-1.41 2.45-.36 6.05 1.01 8.03.67.97 1.46 2.06 2.5 2.02 1.01-.04 1.39-.65 2.61-.65 1.22 0 1.57.65 2.63.63 1.09-.02 1.78-.98 2.44-1.95.77-1.12 1.08-2.2 1.1-2.25-.02-.01-2.12-.81-2.14-3.28z"
                            />

                            <path
                                d="M15.03 6.63c.55-.67.92-1.6.82-2.53-.79.03-1.75.53-2.32 1.2-.51.59-.96 1.54-.84 2.45.89.07 1.8-.45 2.34-1.12z"
                            />

                        </svg>


                        <span>
                            Apple
                        </span>

                    </button>


                </div>



                <!-- =========================================
                     FOOTER
                ========================================== -->

                <div class="already-account">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </div>


            </div>

        </section>


    </main>


    <script src="js/signup.js"></script>

</body>

</html>
