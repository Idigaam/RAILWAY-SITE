<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYA-signup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============ SIGN UP ============ -->
<div class="screen" id="signup">
<div class="screen-label">Sign up</div>
<div class="auth-topbar">
   <span class="logo"><img src="Media/voya-logo.png" alt="image description" width="100" height="100"></span>
    <a class="btn btn-outline" href="home.html">Back to home</a>
</div>
<div class="auth-split">
  <div class="auth-left">
    <span class="tag">Ride the line</span>
    <h2>Every ticket shows the full fare board — class, route, and price, no guessing.</h2>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <div class="toggle-pill"><span><a href="login.html" style="color:inherit">Log in</a></span><span class="active">Sign up</span></div>
      <h1>Welcome to Voya</h1>
      <div class="form-row">
        <div class="form-group"><label>First name</label><input class="input" placeholder="Joe"></div>
        <div class="form-group"><label>Last name</label><input class="input" placeholder="Mike"></div>
      </div>
      <div class="form-group"><label>Email address</label><input class="input" placeholder="you@email.com"></div>
      <div class="form-group">
        <label>Create password</label>
        <div class="input-icon"><input class="input" type="password" placeholder="••••••••"><span class="icon">👁</span></div>
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <div class="input-icon"><input class="input" type="password" placeholder="••••••••"><span class="icon">👁</span></div>
      </div>
      <div class="tiny-terms"><input type="checkbox"><span>I agree to Voya's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span></div>
      <a class="btn btn-orange btn-block" href="bookings.html">Sign in</a>
      <div class="divider">or continue with</div>
      <div class="social-row"><span class="social-btn">G Google</span><span class="social-btn">🍎 Apple</span></div>
      <div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>
</div>

</body>
</html>
