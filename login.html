<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOYA Rail — Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>


<body class="auth-page">


    <!-- =====================================================
         TOP HEADER
    ====================================================== -->

    <header class="auth-topbar">

        <a
            href="index.html"
            class="auth-logo"
            aria-label="VOYA Rail home"
        >

            <img
                src="Media/voya-logo.png"
                alt="VOYA Rail"
            >

        </a>


        <a
            href="index.html"
            class="back-home"
        >
            Back to home
        </a>

    </header>



    <!-- =====================================================
         AUTHENTICATION AREA
    ====================================================== -->

    <main class="auth-layout">


        <!-- =================================================
             LEFT HERO
        ================================================== -->

        <section class="auth-hero">

            <div class="auth-hero-overlay"></div>


            <div class="auth-hero-content">


                <span class="hero-tag">
                    RIDE THE LINE
                </span>


                <h1>
                    Every ticket shows the
                    full fare board — class,
                    route, and price, no
                    guessing.
                </h1>


            </div>

        </section>



        <!-- =================================================
             RIGHT LOGIN
        ================================================== -->

        <section class="auth-panel">

            <div class="auth-form">


                <!-- LOGIN / SIGN UP -->

                <div class="auth-switch">

                    <a
                        href="login.html"
                        class="switch-item active"
                    >
                        Log in
                    </a>


                    <a
                        href="signup.html"
                        class="switch-item"
                    >
                        Sign up
                    </a>

                </div>



                <!-- TITLE -->

                <h2>
                    Welcome back
                </h2>



                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@gmail.com"
                        autocomplete="email"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-field">

                        <input
                            id="password"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />
                            </svg>

                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="auth-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                        >

                        <span>
                            Stay signed in
                        </span>

                    </label>


                    <a href="#">
                        Forgot password?
                    </a>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="button"
                    id="loginBtn"
                    class="primary-button"
                >
                    Log in
                </button>



                <!-- DIVIDER -->

                <div class="auth-divider">

                    <span></span>

                    <p>
                        OR CONTINUE WITH
                    </p>

                    <span></span>

                </div>



                <!-- SOCIAL -->

                <div class="social-buttons">


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="social-button"
                    >

                        <svg
                            class="google-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.68-.06-1.34-.17-1.97H12v3.73h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.15z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.75c2.63 0 4.84-.87 6.45-2.33l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.52A9.75 9.75 0 0 0 12 21.75z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 13.86A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.86V7.62H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.04 4.38l3.25-2.52z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.11c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.18 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.37l3.25 2.52C7.31 7.83 9.46 6.11 12 6.11z"
                            />

                        </svg>


                        <span>
                            Google
                        </span>

                    </button>



                    <!-- APPLE -->

                    <button
                        type="button"
                        class="social-button"
                    >

                        <svg
                            class="apple-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M17.05 12.54c-.02-2.01 1.64-2.98 1.71-3.02-.94-1.37-2.4-1.56-2.91-1.58-1.22-.13-2.4.73-3.02.73-.63 0-1.6-.72-2.63-.7-1.35.02-2.6.79-3.3 2.02-1.41 2.45-.36 6.05 1.01 8.03.67.97 1.46 2.06 2.5 2.02 1.01-.04 1.39-.65 2.61-.65 1.22 0 1.57.65 2.63.63 1.09-.02 1.78-.98 2.44-1.95.77-1.12 1.08-2.2 1.1-2.25-.02-.01-2.12-.81-2.14-3.28z"
                            />

                            <path
                                d="M15.03 6.63c.55-.67.92-1.6.82-2.53-.79.03-1.75.53-2.32 1.2-.51.59-.96 1.54-.84 2.45.89.07 1.8-.45 2.34-1.12z"
                            />

                        </svg>


                        <span>
                            Apple
                        </span>

                    </button>

                </div>



                <!-- FOOTER -->

                <p class="auth-footer">

                    New to VOYA?

                    <a href="signup.html">
                        Create an account
                    </a>

                </p>


            </div>

        </section>

    </main>



    <script src="js/login.js"></script>

</body>

</html>
