<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYA-login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <!-- ============ LOGIN ============ -->
<div class="screen" id="login">
<div class="screen-label">Login</div>
<div class="auth-topbar">
  <span class="logo"><img src="Media/voya-logo.png" alt="image description" width="100" height="100"></span>
  <a class="btn btn-outline" href="index.html">Back to home</a>
</div>
<div class="auth-split">
  <div class="auth-left">
    <span class="tag">Ride the line</span>
    <h2>Every ticket shows the full fare board — class, route, and price, no guessing.</h2>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <div class="toggle-pill"><span class="active">Log in</span><span><a href="signup.html" style="color:inherit">Sign up</a></span></div>
      <h1>Welcome back</h1>
      <div class="form-group"><label>Email address</label><input class="input" placeholder="you@email.com"></div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon"><input class="input" type="password" placeholder="••••••••"><span class="icon">👁</span></div>
      </div>
      <div class="check-row"><label><input type="checkbox"> Stay signed in</label><a href="#">Forgot password?</a></div>
      <a class="btn btn-orange btn-block" href="bookings.html">Log in</a>
      <div class="divider">or continue with</div>
      <div class="social-row"><span class="social-btn">G Google</span><span class="social-btn">🍎 Apple</span></div>
      <div class="auth-foot">New to Voya? <a href="signup.html">Create an account</a></div>
    </div>
  </div>
</div>
</div> 
<script src="script.js"></script>
</body>
</html>
